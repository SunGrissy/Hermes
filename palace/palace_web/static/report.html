<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Palace - 报告详情</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="layout">
  <header class="top-bar">
    <a href="/" class="logo">Palace <span class="logo-sub">批注系统</span></a>
    <div class="top-bar-right">
      <div class="annotator-picker">
        <label>批注人：</label>
        <select id="annotator-role">
          <option value="producer">制作人</option>
          <option value="pld">管线主策 (PLD)</option>
          <option value="pmo">管线总管 (PMO)</option>
          <option value="ple">管线体验 (PLE)</option>
          <option value="plt">管线技术 (PLT)</option>
        </select>
        <input id="annotator-name" type="text" placeholder="姓名" maxlength="20">
      </div>
      <span id="version-info" class="version-info"></span>
    </div>
  </header>

  <main class="report-layout">
    <section id="report-content" class="report-panel">
      <p class="loading">加载中...</p>
    </section>
    <aside id="annotation-sidebar" class="annotation-panel">
      <div class="sidebar-header">
        <h3>批注</h3>
        <div id="anno-stats" class="anno-stats"></div>
      </div>
      <div id="anno-cards" class="anno-cards"></div>
      <div class="sidebar-footer">
        <button id="btn-submit" class="btn btn-primary btn-submit" disabled>完成批注</button>
        <div id="submit-status" class="submit-status"></div>
      </div>
    </aside>
  </main>
</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h3>提交批注</h3>
    <p>提交后将推送钉钉通知（可选），批注将变为只读。</p>
    <label>钉钉 Webhook URL（可选）：</label>
    <input id="dingtalk-webhook" type="text" placeholder="https://oapi.dingtalk.com/robot/send?access_token=..." class="input-full">
    <div class="modal-actions">
      <button id="btn-cancel-submit" class="btn btn-secondary">取消</button>
      <button id="btn-confirm-submit" class="btn btn-primary">确认提交</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  PalaceApp.initReport();
});
</script>
</body>
</html>
