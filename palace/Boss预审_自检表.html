<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Boss预审 · 自检表</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f17;--sf:#1a1a2e;--sf2:#222240;--bd:#2a2a4a;--gold:#d4a533;--gdim:rgba(212,165,51,.15);--txt:#e8e8f0;--dim:#8888aa;--grn:#4ecca3;--red:#ff6b6b;--r:8px}
    *{margin:0;padding:0;box-sizing:border-box} body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6}
    .app{max-width:960px;margin:0 auto;padding:24px 20px 80px}
    .hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--bd);margin-bottom:24px}
    .hdr h1{font-size:1.4rem;font-weight:700;color:var(--gold);letter-spacing:2px} .hdr .sub{font-size:.82rem;color:var(--dim);margin-top:4px}
    .hdr-r{display:flex;align-items:center;gap:12px} .save-ind{font-size:.78rem;color:var(--grn);transition:color .3s} .save-ind.saving{color:var(--gold)}
    .btn{padding:8px 18px;border:none;border-radius:var(--r);font-family:inherit;font-size:.85rem;cursor:pointer;transition:all .2s}
    .btn-gold{background:var(--gold);color:#000;font-weight:600} .btn-gold:hover{background:#e8b944;transform:translateY(-1px)}
    .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)} .btn-outline:hover{background:var(--gdim)}
    .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);font-size:.8rem;padding:6px 14px} .btn-danger:hover{background:rgba(255,107,107,.1)}
    .md-link{font-size:.78rem;color:var(--dim);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit} .md-link:hover{color:var(--gold)}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;background:var(--sf);padding:20px;border-radius:var(--r);border:1px solid var(--bd)}
    .meta .f{display:flex;flex-direction:column;gap:4px} .meta label{font-size:.78rem;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:1px}
    .meta input{background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:8px 12px;color:var(--txt);font-family:inherit;font-size:.9rem} .meta input:focus{outline:none;border-color:var(--gold)}
    .tabs{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
    .tab{flex:1;padding:12px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);color:var(--dim);font-family:inherit;font-size:.88rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;min-width:120px}
    .tab:hover{border-color:var(--gold);color:var(--txt)} .tab.on{border-color:var(--gold);color:var(--gold);background:var(--gdim)}
    .tab b{font-weight:700} .tab .prog{margin-left:auto;font-size:.72rem;background:var(--sf2);padding:2px 8px;border-radius:10px} .tab.on .prog{background:rgba(212,165,51,.25)}
    .tab-arr{color:var(--dim);font-size:1.1rem;flex-shrink:0}
    .sec{animation:fadeIn .3s ease} @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .sec-meta{background:var(--sf);padding:14px 18px;border-radius:var(--r);border:1px solid var(--bd);margin-bottom:16px;font-size:.83rem} .sec-meta span{color:var(--dim)} .sec-meta strong{color:var(--gold)}
    .qcard{background:var(--sf);padding:20px;border-radius:var(--r);border:1px solid var(--bd);margin-bottom:16px;transition:border-color .2s} .qcard:focus-within{border-color:var(--gold)} .qcard.filled{border-left:3px solid var(--grn)}
    .qcard.warn{border-color:var(--red);border-left:3px solid var(--red)} .warn-tag{font-size:.7rem;background:rgba(255,107,107,.15);color:var(--red);padding:2px 8px;border-radius:10px;display:inline-block;margin-left:6px}
    .qid{font-size:.72rem;font-weight:700;color:var(--gold);background:var(--gdim);padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:6px;font-family:'Courier New',monospace}
    .dv-tag{font-size:.68rem;background:rgba(78,204,163,.15);color:var(--grn);padding:2px 8px;border-radius:10px;display:inline-block;margin-left:6px}
    .qtxt{font-size:.93rem;font-weight:500;margin-bottom:8px;line-height:1.5} .qhint{font-size:.78rem;color:var(--dim);margin-bottom:12px;padding:8px 12px;background:var(--sf2);border-radius:4px;border-left:2px solid var(--gold);line-height:1.5}
    textarea.qa{width:100%;min-height:72px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:10px;color:var(--txt);font-family:inherit;font-size:.88rem;resize:vertical;line-height:1.6} textarea.qa:focus{outline:none;border-color:var(--gold)} textarea.qa::placeholder{color:var(--dim);opacity:.5}
    .radio-grp{display:flex;gap:10px;margin-top:10px} .radio-grp label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.88rem;padding:6px 14px;border:1px solid var(--bd);border-radius:var(--r);transition:all .2s} .radio-grp label:hover{border-color:var(--gold)} .radio-grp input[type=radio]{accent-color:var(--gold)} .radio-grp label.sel{border-color:var(--gold);background:var(--gdim);color:var(--gold)}
    .q-cond{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .3s,margin .3s;margin-bottom:0} .q-cond.vis{max-height:600px;opacity:1;margin-bottom:16px}
    .img-zone{border:2px dashed var(--bd);border-radius:var(--r);padding:16px;text-align:center;color:var(--dim);cursor:pointer;transition:border-color .2s;min-height:60px;font-size:.83rem} .img-zone:hover,.img-zone.over{border-color:var(--gold);color:var(--gold)}
    .img-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px} .img-th{position:relative;width:90px;height:90px;border-radius:4px;overflow:hidden;border:1px solid var(--bd)} .img-th img{width:100%;height:100%;object-fit:cover} .img-th .x{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7} .img-th .x:hover{opacity:1}
    .img-grp{margin-bottom:12px} .img-grp-label{font-size:.82rem;color:var(--dim);margin-bottom:6px;font-weight:500}
    .dt-wrap{overflow-x:auto;margin-bottom:8px} .dt{width:100%;border-collapse:collapse;font-size:.83rem} .dt th{background:var(--sf2);color:var(--gold);padding:8px;text-align:left;font-weight:500;border:1px solid var(--bd);white-space:nowrap} .dt td{padding:2px;border:1px solid var(--bd);vertical-align:top} .dt td textarea{width:100%;min-height:36px;background:var(--bg);border:none;color:var(--txt);font-family:inherit;font-size:.83rem;resize:vertical;padding:4px} .dt td textarea:focus{outline:1px solid var(--gold)} .dt td select{background:var(--bg);border:none;color:var(--txt);font-family:inherit;font-size:.83rem;padding:4px;width:100%} .dt .ra{width:28px;text-align:center} .dt .xr{background:none;border:none;color:var(--red);cursor:pointer;font-size:.9rem;opacity:.4} .dt .xr:hover{opacity:1}
    .add-r{margin-top:6px;background:var(--sf2);color:var(--dim);border:1px dashed var(--bd);border-radius:var(--r);padding:5px 14px;font-family:inherit;font-size:.82rem;cursor:pointer} .add-r:hover{border-color:var(--gold);color:var(--gold)}
    .curve-wrap{background:var(--sf);padding:16px;border-radius:var(--r);border:1px solid var(--bd);margin-bottom:12px;position:relative}
    .curve-area{position:relative;height:240px;margin-bottom:4px} .curve-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
    .curve-sliders{display:flex;height:240px}
    .cs-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1} .cs-col input[type=range]{writing-mode:vertical-lr;direction:rtl;height:180px;width:20px;accent-color:var(--gold);cursor:pointer} .cs-col .bl{font-size:.6rem;color:var(--dim);text-align:center;max-width:55px;word-break:break-all;line-height:1.2} .cs-col .bv{font-size:.68rem;color:var(--gold);font-weight:600}
    .curve-legend{display:flex;gap:14px;font-size:.78rem;margin-top:6px;color:var(--dim)} .curve-legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
    .curve-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd);font-size:.75rem;color:var(--dim)}
    .cc-seg{display:flex;align-items:center;gap:3px} .cc-seg b{color:var(--txt);font-weight:500}
    .cc-btn{background:none;border:1px solid var(--bd);color:var(--dim);cursor:pointer;font-size:.65rem;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1} .cc-btn:hover{border-color:var(--gold);color:var(--gold)}
    .cc-del{color:var(--red);border-color:transparent} .cc-del:hover{border-color:var(--red)}
    .cc-ph{display:inline-flex;align-items:center;gap:1px;font-size:.68rem;padding:1px 4px;background:rgba(255,255,255,.06);border-radius:3px;margin:0 1px;color:var(--txt)}
    .cc-mv{font-size:.55rem;width:14px;height:14px;border-color:transparent;opacity:.5} .cc-mv:hover{opacity:1;border-color:var(--gold)}
    .cc-reset{background:none;border:1px solid var(--bd);color:var(--dim);cursor:pointer;font-size:.72rem;padding:2px 10px;border-radius:4px;margin-left:auto;font-family:inherit} .cc-reset:hover{border-color:var(--gold);color:var(--gold)}
    .attach-box{background:var(--sf);padding:14px 18px;border-radius:var(--r);border:1px solid var(--bd);margin-bottom:16px} .attach-box label{font-size:.82rem;color:var(--dim);display:block;margin-bottom:6px;font-weight:500} .attach-box input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:8px 12px;color:var(--txt);font-family:inherit;font-size:.88rem} .attach-box input[type=text]:focus{outline:none;border-color:var(--gold)}
    .eval-sec{margin-top:24px;padding-top:16px;border-top:1px solid var(--bd)} .eval-sec h3{font-size:.82rem;color:var(--gold);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
    .eval-grp{margin-bottom:14px} .eval-grp-t{font-size:.78rem;color:var(--dim);margin-bottom:6px;font-weight:500}
    .eval-row{display:flex;align-items:center;gap:10px;padding:6px 0} .eval-lb{flex:1;font-size:.83rem;min-width:100px} .eval-ht{font-size:.7rem;color:var(--dim);margin-top:1px}
    .eval-sl{flex:2;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--sf2);outline:none} .eval-sl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer}
    .eval-v{width:22px;text-align:center;font-size:.83rem;color:var(--gold);font-weight:600}
    .foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:14px;border-top:1px solid var(--bd)} .foot-r{display:flex;gap:12px;align-items:center}
    .toast{position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:var(--r);font-size:.83rem;opacity:0;transform:translateY(10px);transition:all .3s;z-index:100} .toast.show{opacity:1;transform:none} .toast.ok{background:var(--grn);color:#000} .toast.info{background:var(--gold);color:#000}
    @media(max-width:640px){.meta{grid-template-columns:1fr} .tabs{flex-direction:column} .tab-arr{display:none} .tab{min-width:auto} .eval-row{flex-wrap:wrap}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hdr">
      <div><h1>Boss预审 &middot; 自检表</h1><p class="sub">A 选题/概念/情绪 &rarr; B 表演结构设计 &rarr; C 制作</p></div>
      <div class="hdr-r"><span class="save-ind" id="si">&bull; 已保存</span><button class="btn btn-gold" onclick="copySec()">复制当前区</button></div>
    </header>
    <section class="meta">
      <div class="f"><label>Boss 名称</label><input id="m_name" placeholder="如：诸葛亮（三气周瑜）" oninput="sch()"></div>
      <div class="f"><label>填写人</label><input id="m_author" placeholder="策划/美术姓名" oninput="sch()"></div>
      <div class="f"><label>填写日期</label><input type="date" id="m_date" oninput="sch()"></div>
      <div class="f"><label>目标版本</label><input id="m_ver" placeholder="如：0422五一版本" oninput="sch()"></div>
    </section>
    <nav class="tabs">
      <button class="tab on" data-s="A" onclick="sw('A')"><b>A</b> 选题/概念/情绪<span class="prog" id="pA">0/8</span></button>
      <span class="tab-arr">&rarr;</span>
      <button class="tab" data-s="B" onclick="sw('B')"><b>B</b> 表演结构设计<span class="prog" id="pB">0/4</span></button>
      <span class="tab-arr">&rarr;</span>
      <button class="tab" data-s="C" onclick="sw('C')"><b>C</b> 制作<span class="prog" id="pC">0/4</span></button>
    </nav>
    <main id="mc"></main>
  </div>
  <div class="toast" id="toast"></div>
<script>
const SEC=[
 {id:'A',name:'A-选题/概念/情绪',pre:'无',unlock:'B 表演结构设计',reviewer:'制作人',attach:[],
  q:[
   {id:'A1',t:'text',q:'一句话说清这个Boss是谁、打爆它的核心情绪是什么。',h:'这句话有没有画面感？一个不了解项目的人听到这句话，脑子里有画面吗？',dv:'核心概念一句话'},
   {id:'A2',t:'text',q:'这个角色的名字说出来，目标用户（中年男性）脑中瞬间浮现的画面是什么？尽量具体。',h:'画面越具体越好——有颜色、有动作、有标志性元素。如果只能写"大概知道是个XX"，说明认知具象度不够。'},
   {id:'A3',t:'text-radio',q:'这个角色天然自带什么情绪？用2-3个情绪词概括。',h:'"霸道、危险、狂暴"是重的；"优雅、温柔、灵动"是轻的。如果偏轻，下方追加题必填。',radio:{name:'weight',options:['\u504f\u91cd','\u504f\u8f7b']}},
   {id:'A3x',t:'text',q:'\u3010\u504f\u8f7b \u26a0\ufe0f \u6ce8\u610f\u786e\u8ba4\u8c03\u6027\u3011\u4f60\u51c6\u5907\u4ece\u8fd9\u4e2a\u89d2\u8272\u7684\u54ea\u4e2a\u4fa7\u9762\u5207\u5165\uff0c\u628a\u8c03\u6027\u62c9\u5230\u201c\u91cd\u201d\uff1f\u5177\u4f53\u600e\u4e48\u505a\uff1f',h:'\u8fd9\u4e2a\u5207\u5165\u89d2\u5ea6\u505a\u51fa\u6765\u4e4b\u540e\uff0c\u53bb\u6389\u89d2\u8272\u540d\u5b57\uff0c\u7528\u6237\u8fd8\u80fd\u8ba4\u51fa\u662f\u8c01\u5417\uff1f\u5982\u679c\u8ba4\u4e0d\u51fa\uff0c\u4f60\u53ef\u80fd\u6539\u8fc7\u5934\u4e86\u3002',cond:{field:'A3_weight',val:'\u504f\u8f7b'},warn:true},
   {id:'A4',t:'img-groups',q:'\u4e0a\u4f20\u8c03\u6027\u53c2\u8003\u56fe\u548c\u60c5\u7eea\u677f\uff0c\u5e76\u7528\u4e00\u53e5\u8bdd\u8bf4\u660e\uff1a\u4f60\u548c\u8fd9\u4e9b\u56fe\u5904\u5728\u540c\u4e00\u4e2a\u4ec0\u4e48\u6837\u7684\u201c\u573a\u201d\u91cc\uff1f',h:'\u627e2-3\u5f20\u4f60\u89c9\u5f97\u548c\u4f60\u7684\u8bbe\u8ba1\u5728\u540c\u4e00\u4e2a\u91cd\u91cf\u7ea7\u7684\u53c2\u8003\u56fe\u3002\u5bf9\u9f50\u7ef4\u5ea6\u53c2\u8003\uff1a\u89c6\u89c9\u590d\u6742\u5ea6\u3001\u534e\u4e3d/\u7cbe\u81f4\u7a0b\u5ea6\u3001\u89d2\u8272\u6c14\u573a/\u59ff\u6001\u3001\u753b\u9762\u538b\u8feb\u611f\u2014\u2014\u81f3\u5c11\u4e00\u4e2a\u7ef4\u5ea6\u5bf9\u5f97\u4e0a\u3002',dv:'\u8c03\u6027\u53c2\u8003\u56fe+\u60c5\u7eea\u677f',
    groups:[{name:'\u8c03\u6027\u53c2\u8003\u56fe',hint:'2-3\u5f20\uff0c\u89c6\u89c9\u590d\u6742\u5ea6/\u534e\u4e3d\u5ea6/\u6c14\u573a/\u538b\u8feb\u611f\u81f3\u5c11\u4e00\u7ef4\u5bf9\u9f50',min:2},{name:'\u60c5\u7eea\u677f',hint:'5\u5f20\u4ee5\u4e0a\uff0c\u9501\u5b9a\u89d2\u8272\u6c14\u8d28\u3001\u8272\u5f69\u503e\u5411\u3001\u6c1b\u56f4\u611f',min:5}],desc:true},
   {id:'A5',t:'text',q:'\u8fd9\u6b21\u505a\u7684Boss\u548c\u5df2\u6709Boss\u76f8\u6bd4\uff0c\u73a9\u5bb6\u611f\u53d7\u5230\u7684\u4e0d\u540c\u5728\u54ea\uff1f\u8bf4\u5177\u4f53\u3002',h:'\u4f60\u7684\u56de\u7b54\u91cc\u6709\u6ca1\u6709\u51fa\u73b0\u201c\u65b0\u7684\u8282\u594f\u578b/\u65b0\u7684\u60ac\u5ff5\u63ed\u6653\u65b9\u5f0f/\u65b0\u7684\u89c6\u89c9\u611f\u53d7\u201d\u4e2d\u7684\u81f3\u5c11\u4e00\u4e2a\uff1f',dv:'\u73a9\u6cd5\u671f\u5f85\u5ea6\u8bf4\u660e'},
   {id:'A6',t:'text-img',q:'\u7f8e\u672f\u4fa7\uff1a\u8fd9\u6b21\u6709\u4e00\u4e2a\u4ec0\u4e48\u6837\u7684\u753b\u9762/\u77ac\u95f4/\u624b\u6cd5\u662f\u4ee5\u524d\u6ca1\u505a\u8fc7\u7684\uff1f',h:'\u4f60\u80fd\u4e0d\u80fd\u7528\u4e00\u53e5\u8bdd\u8ba9\u522b\u4eba\u8111\u4e2d\u51fa\u73b0\u8fd9\u4e2a\u65b0\u753b\u9762\uff1f',dv:'\u89c6\u89c9\u65b0\u9c9c\u70b9'},
   {id:'A7',t:'text',q:'\u73a9\u5bb6\u6253\u7206\u8fd9\u4e2aBoss\u4e4b\u540e\uff0c\u5e94\u8be5\u611f\u53d7\u5230\u7684\u4e00\u4e2a\u8bcd\u662f\u4ec0\u4e48\uff1f',h:'\u8fd9\u4e2a\u8bcd\u662f\u4e0d\u662f\u4e00\u79d2\u949f\u5c31\u84ec\u51fa\u6765\u4e86\uff1f\u5982\u679c\u60f3\u4e86\u5f88\u4e45\u624d\u51d1\u51fa\u6765\uff0c\u8bf4\u660e\u89d2\u8272\u548cBoss\u673a\u5236\u4e4b\u95f4\u7684\u60c5\u7eea\u94fe\u63a5\u4e0d\u5929\u7136\u3002'},
   {id:'A8',t:'text',q:'\u5982\u679c\u4e00\u4e2a\u73a9\u5bb6\u53ea\u770b\u4e86\u8fd9\u4e2aBoss\u7684\u6253\u7206\u8868\u6f14\uff0c\u6ca1\u770b\u4efb\u4f55\u4ecb\u7ecd\uff0c\u4ed6\u4f1a\u60f3\u62e5\u6709/\u518d\u6b21\u4f53\u9a8c\u8fd9\u4e2a\u89d2\u8272\u5417\uff1f\u4e3a\u4ec0\u4e48\uff1f',h:'\u4f60\u7684\u201c\u4e3a\u4ec0\u4e48\u201d\u91cc\u6709\u6ca1\u6709\u5177\u4f53\u7684\u3001\u6765\u81ea\u8868\u6f14\u753b\u9762\u7684\u7406\u7531\uff1f'}

const TS='color:#333;border-collapse:collapse;font-size:14px',TH='background:#f5f5f5;color:#222;padding:6px 10px;border:1px solid #ccc;font-weight:600',TD='padding:6px 10px;border:1px solid #ddd;color:#333';
function copySec(){const s=SEC.find(x=>x.id===cur),d=gd(),m=d.meta||{};
  let html=`<div style="color:#333;background:transparent;font-family:sans-serif;line-height:1.6;font-size:14px">`;
  html+=`<h2 style="color:#222;margin:0 0 8px">${esc(s.name)}</h2><table style="${TS}"><tr><td style="${TD}">Boss</td><td style="${TD}">${esc(m.name||'')}</td><td style="${TD}">\u586b\u5199\u4eba</td><td style="${TD}">${esc(m.author||'')}</td><td style="${TD}">\u65e5\u671f</td><td style="${TD}">${esc(m.date||'')}</td><td style="${TD}">\u7248\u672c</td><td style="${TD}">${esc(m.ver||'')}</td></tr></table>`;
  s.attach.forEach(a=>{if(a.type==='link')html+=`<p><b>${a.label}:</b> ${esc(d.att[a.id]||'')}</p>`;
    if(a.type==='img'){(d.imgs[a.id]||[]).forEach(im=>{html+=`<img src="${im}" style="max-width:300px;margin:4px">`})}});
  s.q.forEach(q=>{if(q.cond&&!checkCond(q.cond,d))return;
    html+=`<h3 style="color:#222;margin:12px 0 4px">${q.id}. ${esc(q.q.replace(/\n/g,' '))}</h3>`;
    if(q.t==='text'||q.t==='text-radio'||q.t==='text-img'){html+=`<p style="color:#333">${esc(d.ans[q.id]||'').replace(/\n/g,'<br>')}</p>`;
      if(q.t==='text-radio'){const rv=d.ans[q.id+'_'+q.radio.name];if(rv)html+=`<p>\u5224\u65ad: <b>${rv}</b></p>`}}
    else if(q.t==='img-groups'){q.groups.forEach((g,gi)=>{html+=`<p><b>${g.name}:</b></p>`;
      (d.imgs[q.id+'_g'+gi]||[]).forEach(im=>{html+=`<img src="${im}" style="max-width:200px;margin:4px">`})});
      if(q.desc&&d.ans[q.id])html+=`<p style="color:#333">${esc(d.ans[q.id]).replace(/\n/g,'<br>')}</p>`}
    else if(q.t==='dyn-table'){const rows=d.tbl[q.id]||[];if(rows.length){
      html+=`<table style="${TS}"><tr>${q.cols.map(c=>`<th style="${TH}">`+c+'</th>').join('')}</tr>`;
      rows.forEach(r=>{html+='<tr>'+r.map(c=>`<td style="${TD}">`+esc(c)+'</td>').join('')+'</tr>'});html+='</table>'}}
    else if(q.t==='curve'||q.t==='curve-cmp'){const beats=getCurveBeats(),vals=d.crv[q.id]||beats.map(()=>50);
      html+=`<table style="${TS}"><tr><th style="${TH}">\u8282\u62cd</th><th style="${TH}">\u60c5\u7eea</th></tr>`;
      beats.forEach((b,i)=>{html+=`<tr><td style="${TD}">${b.seg}-${b.phase}</td><td style="${TD}">${vals[i]||50}</td></tr>`});html+='</table>'}
    if(q.t==='text-img')(d.imgs[q.id]||[]).forEach(im=>{html+=`<img src="${im}" style="max-width:200px;margin:4px">`})});
  if(s.eval){html+=`<h3 style="color:#222;margin:12px 0 4px">\u81ea\u8bc4</h3><table style="${TS}"><tr><th style="${TH}">\u6807\u51c6</th><th style="${TH}">\u5206\u6570</th></tr>`;
    if(s.eval.std)s.eval.std.forEach((it,i)=>{html+=`<tr><td style="${TD}">${it.n}</td><td style="${TD}">${d.ev['ev_'+s.id+'_s'+i]||3}</td></tr>`});
    if(s.eval.dim)s.eval.dim.forEach((it,i)=>{html+=`<tr><td style="${TD}">${it.n}</td><td style="${TD}">${d.ev['ev_'+s.id+'_d'+i]||3}</td></tr>`});
    html+='</table>'}
  html+='</div>';copyHtml(html)}
function copyHtml(html){const div=document.createElement('div');div.innerHTML=html;div.style.cssText='position:fixed;left:-9999px;top:0';
  document.body.appendChild(div);const sel=window.getSelection();sel.removeAllRanges();
  const range=document.createRange();range.selectNodeContents(div);sel.addRange(range);
  document.execCommand('copy');sel.removeAllRanges();document.body.removeChild(div);toast('\u5df2\u590d\u5236\u5230\u526a\u8d34\u677f')}
function exportMD(){const d=gd(),m=d.meta||{},s=SEC.find(x=>x.id===cur);
  let md=`# Boss\u9884\u5ba1 \u00b7 ${s.name}\n\n| \u9879\u76ee | \u5185\u5bb9 |\n|---|---|\n| Boss | ${m.name||''} |\n| \u586b\u5199\u4eba | ${m.author||''} |\n| \u65e5\u671f | ${m.date||''} |\n| \u7248\u672c | ${m.ver||''} |\n\n`;
  s.attach.forEach(a=>{if(a.type==='link')md+=`**${a.label}:** ${d.att[a.id]||''}\n\n`;
    if(a.type==='img'){const n=(d.imgs[a.id]||[]).length;md+=`**${a.label}:** ${n?'\u5df2\u4e0a\u4f20'+n+'\u5f20':'\u672a\u4e0a\u4f20'}\n\n`}});
  s.q.forEach(q=>{if(q.cond&&!checkCond(q.cond,d))return;md+=`### ${q.id}. ${q.q.replace(/\n/g,' ')}\n\n`;
    if(q.t==='text'||q.t==='text-radio'||q.t==='text-img'){md+=`${d.ans[q.id]||'\u672a\u586b\u5199'}\n\n`;
      if(q.t==='text-radio'){const rv=d.ans[q.id+'_'+q.radio.name];if(rv)md+=`\u5224\u65ad: **${rv}**\n\n`}}
    else if(q.t==='img-groups'){q.groups.forEach((g,gi)=>{const n=(d.imgs[q.id+'_g'+gi]||[]).length;
      md+=`**${g.name}:** ${n?'\u5df2\u4e0a\u4f20'+n+'\u5f20':'\u672a\u4e0a\u4f20'}\n`});if(q.desc)md+=`\n${d.ans[q.id]||''}\n\n`}
    else if(q.t==='dyn-table'){const rows=d.tbl[q.id]||[];if(rows.length){
      md+=`| ${q.cols.join(' | ')} |\n|${q.cols.map(()=>'---').join('|')}|\n`;rows.forEach(r=>{md+=`| ${r.join(' | ')} |\n`});md+='\n'}}
    else if(q.t==='curve'||q.t==='curve-cmp'){const beats=getCurveBeats(),vals=d.crv[q.id]||beats.map(()=>50);
      md+='| \u8282\u62cd | \u60c5\u7eea |\n|---|---|\n';beats.forEach((b,i)=>{md+=`| ${b.seg}-${b.phase} | ${vals[i]||50} |\n`});md+='\n'}});
  if(s.eval){md+='### \u81ea\u8bc4\n\n| \u6807\u51c6 | \u5206 |\n|---|---|\n';
    if(s.eval.std)s.eval.std.forEach((it,i)=>{md+=`| ${it.n} | ${d.ev['ev_'+s.id+'_s'+i]||3} |\n`});
    if(s.eval.dim)s.eval.dim.forEach((it,i)=>{md+=`| ${it.n} | ${d.ev['ev_'+s.id+'_d'+i]||3} |\n`});md+='\n'}
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`Boss\u9884\u5ba1_${s.name}_${m.name||'unnamed'}_${m.date||''}.md`;
  a.click();URL.revokeObjectURL(a.href);toast('\u5df2\u5bfc\u51fa '+s.name+' MD')}
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>t.classList.remove('show'),2500)}
(function init(){const d=gd();
  if(d.meta){document.getElementById('m_name').value=d.meta.name||'';document.getElementById('m_author').value=d.meta.author||'';
    document.getElementById('m_date').value=d.meta.date||'';document.getElementById('m_ver').value=d.meta.ver||''}
  if(!d.meta?.date){document.getElementById('m_date').value=new Date().toISOString().slice(0,10);sch()}
  render()})()
