id: version_layout
name: "版本内容排布预审"
mode: review
target: version
pipeline_stage: planning

extraction_role: layout_analyst
assessment_roles: [pld, pmo]

role_overrides:
  pld:
    authority: concern
    review_dimensions:
      - "版本体验主线是否清晰？Feature 组合能否承载？"
      - "各 Feature 的体验意图是否互补而非重复？"
      - "用户价值覆盖是否有盲区？（免费玩家仅需基础金币获取即可）"
      - "是否存在只有标题没有体验意图的'裸 Feature'？"
      - "版本整体的内容新鲜度如何？是否过度依赖惯性复用？"
      - "快慢轨配比是否与版本目标匹配？"
      - "各 Feature 的 WHAT 命题是否清晰？（体验意图+scope边界。注意：规划阶段不要求给出 HOW / 处理方案 / 数值参数）"
      - "投入产出比：各 Feature 的预期用户价值与研发投入是否匹配？"
  pmo:
    authority: advisory
    review_dimensions:
      - "版本内慢轨 Feature 数量与可用资源是否匹配？（所有Feature共享同一发版截止日）"
      - "是否有多个慢轨 Feature 竞争同一瓶颈资源？（程序/美术/策划Owner）"
      - "各 Feature 的 WHAT 命题是否清晰到可以启动详设？（只看意图和 scope，不要求 HOW）"
      - "同一Owner承担多个Feature时，并行设计工作量是否现实？"
      - "版本核心体验是否过度依赖单个 Feature（单点故障风险）？"
      - "快轨 Feature 是否都在框架能力清单范围内？"

synthesis_rules:
  any_block_means_block: true
  concern_threshold: 1
  must_list_action_items: true
  no_hedging: true

output_includes:
  - overall_verdict
  - per_role_verdicts
  - action_items
  - composition_overview
  - per_feature_what_status
  - reminders
