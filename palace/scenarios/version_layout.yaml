id: version_layout
name: "版本内容排布预审"
mode: review
target: version
pipeline_stage: planning

extraction_role: layout_analyst
assessment_roles: [pld, pmo]

role_overrides:
  pld:
    authority: concern
    review_dimensions:
      - "[版本级] 版本体验主线是否清晰？Feature 组合能否承载？"
      - "[版本级] 各 Feature 的体验意图是否互补而非重复？"
      - "[通用] 用户价值覆盖是否有盲区？（免费玩家=暂不想付费的玩家，确保启动金币+消耗返利足够参与即可）"
      - "[通用] 是否存在只有标题没有体验意图的'裸 Feature'？"
      - "[版本级] 版本内容新鲜度评估（严格标准）：全快轨换皮=低新鲜度（即使商业合理也要标注）；快轨框架内机制调整=中等新鲜度；有慢轨新系统/新玩法=高新鲜度。标注等级并说明依据。当判定为低新鲜度但合理时，必须追加反问：是否已排除了所有可能通过内容投放、简单规则调整等'巧劲'带来新鲜体验的路径？如果未排除，提醒PLD重新评估。"
      - "[版本级] 快慢轨配比是否与版本目标匹配？"
      - "[通用] 各 Feature 的 WHAT 命题是否清晰？（体验意图+scope边界。注意：规划阶段不要求给出 HOW / 处理方案 / 数值参数）"
      - "[通用] 投入产出比：各 Feature 的预期用户价值与研发投入是否匹配？"
    review_dimensions_feature:
      - "Feature 的 WHAT 命题是否清晰？（体验意图+scope边界）"
      - "用户价值覆盖：不同付费层级玩家在此 Feature 中是否都有参与路径？"
      - "Feature 内部结构性依赖：是否存在单点依赖、耦合风险？"
      - "设计决策边界：个人判断 vs 已对齐的团队决策是否区分清晰？"
      - "前置条件和外部依赖是否声明完整？"
      - "投入产出比：Feature 的复杂度与预期价值是否匹配？"
  pmo:
    authority: advisory
    review_dimensions:
      - "[版本级] 版本内慢轨 Feature 数量与可用资源是否匹配？（所有Feature共享同一发版截止日）"
      - "[版本级] 是否有多个慢轨 Feature 竞争同一瓶颈资源？（程序/美术/策划Owner）"
      - "[通用] 各 Feature 的 WHAT 命题是否清晰到可以启动详设？（只看意图和 scope，不要求 HOW）"
      - "[版本级] 同一Owner承担多个Feature时，并行设计工作量是否现实？"
      - "[通用] 版本核心体验是否过度依赖单个 Feature（单点故障风险）？"
      - "[版本级] 快轨 Feature 是否都在框架能力清单范围内？"
    review_dimensions_feature:
      - "Feature 的研发复杂度评估：涉及多少子系统、跨系统联动的边界情况是否密集？"
      - "Feature 的 WHAT 命题是否清晰到可以启动详设？"
      - "Feature 内部是否存在结构性单点故障风险？"
      - "前置条件（数值、上游系统）的就绪状态和时序依赖是否明确？"

synthesis_rules:
  any_block_means_block: true
  concern_threshold: 1
  must_list_action_items: true
  no_hedging: true

output_includes:
  - overall_verdict
  - per_role_verdicts
  - action_items
  - composition_overview
  - per_feature_what_status
  - reminders
