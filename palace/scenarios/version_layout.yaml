id: version_layout
name: "版本内容排布预审"
mode: review
target: version
pipeline_stage: planning

extraction_role: layout_analyst
assessment_roles: [pld, pmo]

role_overrides:
  pld:
    authority: concern
    review_dimensions:
      - "版本体验主线是否清晰？Feature 组合能否承载？"
      - "各 Feature 的体验意图是否互补而非重复？"
      - "用户价值覆盖是否有盲区？哪些用户群被忽视了？"
      - "是否存在只有标题没有体验意图的'裸 Feature'？"
      - "版本整体的内容新鲜度如何？是否过度依赖惯性复用？"
      - "快慢轨配比是否与版本目标匹配？"
  pmo:
    authority: advisory
    review_dimensions:
      - "版本内慢轨 Feature 数量与可用资源是否匹配？"
      - "是否有多个慢轨 Feature 竞争同一瓶颈资源？"
      - "各 Feature 的 WHAT 交代是否足够让下游启动？"
      - "版本排期是否现实？内容上线节奏与研发周期是否对齐？"
      - "版本核心体验是否过度依赖单个 Feature（单点故障风险）？"

synthesis_rules:
  any_block_means_block: true
  concern_threshold: 1
  must_list_action_items: true
  no_hedging: true

output_includes:
  - overall_verdict
  - per_role_verdicts
  - action_items
  - composition_overview
  - per_feature_what_status
