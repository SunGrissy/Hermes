    function init() {
        const mSel = document.getElementById('mSel');
        const months = [...new Set(rawData.map(d => d['月份']))].filter(x=>x&&x!=='null');
        const order = {"Nov-25":1, "Dec-25":2, "Jan-26":3, "Feb-26":4};
        months.sort((a,b) => (order[a]||99)-(order[b]||99));
        months.forEach(m => mSel.add(new Option(m,m)));

        const nSel = document.getElementById('nSel');
        [...new Set(rawData.map(d => d['计费点名称']))].filter(x=>x).sort().forEach(n => nSel.add(new Option(n,n)));
        upd();
    }

    function upd() {
        const m = document.getElementById('mSel').value;
        document.getElementById('nSel').value = "ALL";
        if(m==='ALL') { renderG(); } else { renderM(m); }
    }

    function renderM(m) {
        document.getElementById('vTitle').innerText = "📅 视图：月份明细 - " + m + " (按消耗倒序)";
        let ds = rawData.filter(d => String(d['月份']) === String(m));
        ds.sort((a,b) => b['礼包总消耗'] - a['礼包总消耗']);
        
        let h = '<table><thead><tr><th>计费点id</th><th>计费点名称</th><th>人数</th><th>人次</th><th>礼包总消耗</th><th>ARPPU</th><th>占比</th><th>排名</th></tr></thead><tbody>';
        ds.forEach(d => {
            h += `<tr>
                <td>${d['计费点id']}</td><td class="hl">${d['计费点名称']}</td>
                <td class="val-num">${d['购买人数']}</td><td class="val-num">${d['购买人次']}</td>
                <td class="val-num" style="color:#cf1322">${Number(d['礼包总消耗']).toLocaleString()}</td>
                <td class="val-num">${toArp(d['arppu_fixed'])}</td>
                <td class="val-num">${toPct(d['月度流水占比'])}</td>
                <td><span class="rank-badge">${d['本月表现倒数排名']}</span></td></tr>`;
        });
        document.getElementById('tCont').innerHTML = h + '</tbody></table>';
    }

    function renderG() {
        document.getElementById('vTitle').innerText = "🌎 视图：全量汇总 (Nov-25 ~ Feb-26)";
        let agg = {}; let total = 0;
        rawData.forEach(d => {
            let id = d['计费点id']; 
            if(!agg[id]) agg[id] = {id:id, n:d['计费点名称'], s:0};
            agg[id].s += d['礼包总消耗']; total += d['礼包总消耗'];
        });
        let sorted = Object.values(agg).sort((a,b)=>b.s-a.s);
        let h = '<table><thead><tr><th>计费点id</th><th>计费点名称</th><th>累计消耗SUM</th><th>总流水占比</th></tr></thead><tbody>';
        sorted.forEach(i => {
            let p = total ? (i.s/total*100).toFixed(2)+'%' : '0%';
            h += `<tr><td>${i.id}</td><td class="hl">${i.n}</td><td class="val-num">${i.s.toLocaleString()}</td><td class="val-num">${p}</td></tr>`;
        });
        document.getElementById('tCont').innerHTML = h + '</tbody></table>';
    }

    function updByN() {
        const n = document.getElementById('nSel').value; 
        if(n === "ALL") {
            upd(); 
            return;
        }
        document.getElementById('mSel').value = "ALL";
        document.getElementById('vTitle').innerText = "📈 趋势分析：" + n;
        let ds = rawData.filter(d => d['计费点名称'] === n);
        const order = {"Nov-25":1, "Dec-25":2, "Jan-26":3, "Feb-26":4};
        ds.sort((a,b) => (order[a['月份']]||99)-(order[b['月份']]||99));
        
        let h = '<table><thead><tr><th>月份</th><th>人数</th><th>人次</th><th>礼包总消耗</th><th>ARPPU</th><th>流水占比</th><th>排名</th></tr></thead><tbody>';
        ds.forEach(d => {
            h += `<tr><td><b>${d['月份']}</b></td><td class="val-num">${d['购买人数']}</td><td class="val-num">${d['购买人次']}</td>
                <td class="val-num" style="color:#cf1322">${d['礼包总消耗'].toLocaleString()}</td>
                <td class="val-num">${toArp(d['arppu_fixed'])}</td>
                <td class="val-num">${toPct(d['月度流水占比'])}</td>
                <td><span class="rank-badge">${d['本月表现倒数排名']}</span></td></tr>`;
        });
        document.getElementById('tCont').innerHTML = h + '</tbody></table>';
    }
    init();
</script>
</body>
</html>
