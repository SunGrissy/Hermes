<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>MD Reader</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
<style>
/* === RESET & LAYOUT === */
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --sidebar-w: 300px;
  --bg: #ffffff;
  --sidebar-bg: #ffffff;
  --border: #d0d7de;
  --accent: #0969da;
  --accent-light: #ddf4ff;
  --text: #1f2328;
  --text-dim: #656d76;
  --hover: #f3f4f6;
  --fav-color: #e3b341;
  --search-hl: #fff8c5;
}
html, body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
#app { display:flex; height:100vh; }

/* === SIDEBAR === */
#sidebar {
  width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--sidebar-bg);
  border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden;
}
#sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
#sidebar-header h1 { font-size:18px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
#sidebar-header h1 svg { width:20px; height:20px; }
#root-bar {
  display:flex; align-items:center; gap:4px; margin-bottom:8px;
  padding:4px 8px; background:var(--hover); border-radius:6px; font-size:12px; color:var(--text-dim);
  cursor:pointer; overflow:hidden;
}
#root-bar:hover { background:#e8eaed; }
#root-bar span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
#root-input-wrap { display:none; margin-bottom:8px; }
#root-input {
  width:100%; padding:6px 8px; border:1px solid var(--accent); border-radius:6px;
  font-size:12px; outline:none; font-family:monospace;
}
#search-box {
  width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:6px;
  font-size:14px; outline:none; transition:border .2s;
}
#search-box:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(9,105,218,.12); }
#sidebar-tabs {
  display:flex; border-bottom:1px solid var(--border);
}
.sidebar-tab {
  flex:1; padding:8px 0; text-align:center; font-size:13px; cursor:pointer;
  color:var(--text-dim); border-bottom:2px solid transparent; transition:all .15s;
}
.sidebar-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
.sidebar-tab:hover { background:var(--hover); }
#file-list {
  flex:1; overflow-y:auto; padding:8px 0;
}
#search-results {
  flex:1; overflow-y:auto; padding:8px 0; display:none;
}
.dir-group { margin-bottom:4px; }
.dir-name {
  padding:4px 16px; font-size:12px; font-weight:600; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:.5px; cursor:pointer; display:flex; align-items:center; gap:4px;
  user-select:none;
}
.dir-name:hover { background:var(--hover); }
.dir-name .arrow { transition:transform .15s; font-size:10px; }
.dir-name.collapsed .arrow { transform:rotate(-90deg); }
.dir-name.collapsed + .dir-files { display:none; }
.file-item {
  padding:6px 16px 6px 28px; font-size:13px; cursor:pointer; display:flex;
  align-items:center; gap:6px; transition:background .1s; position:relative;
}
.file-item:hover { background:var(--hover); }
.file-item.active { background:var(--accent-light); color:var(--accent); font-weight:500; }
.file-item .fav-star {
  opacity:0; cursor:pointer; color:var(--text-dim); font-size:14px; margin-left:auto;
  transition:opacity .15s;
}
.file-item:hover .fav-star, .file-item .fav-star.is-fav { opacity:1; }
.file-item .fav-star.is-fav { color:var(--fav-color); }
.file-meta { font-size:11px; color:var(--text-dim); margin-left:auto; white-space:nowrap; }

/* search results */
.search-result-file { padding:8px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
.search-result-file:hover { background:var(--hover); }
.search-result-path { font-size:13px; font-weight:600; color:var(--accent); margin-bottom:4px; }
.search-result-snippet { font-size:12px; color:var(--text-dim); line-height:1.5; }
.search-result-snippet mark { background:var(--search-hl); padding:1px 2px; border-radius:2px; }

/* === SIDEBAR COLLAPSE === */
#sidebar { transition:width .2s, min-width .2s; }
#sidebar.collapsed { width:0; min-width:0; border-right:none; overflow:hidden; }
#sidebar-toggle {
  position:absolute; top:8px; left:var(--sidebar-w); z-index:10;
  width:24px; height:24px; border:1px solid var(--border); border-radius:4px;
  background:var(--sidebar-bg); cursor:pointer; display:flex; align-items:center;
  justify-content:center; font-size:12px; color:var(--text-dim); transition:left .2s;
}
#sidebar-toggle:hover { background:var(--hover); color:var(--accent); }
#sidebar-toggle.collapsed-pos { left:0; }

/* === ANNOTATION SIDEBAR === */
:root { --anno-w: 280px; }
#anno-panel {
  width:0; min-width:0; background:var(--sidebar-bg); border-left:none;
  display:flex; flex-direction:column; overflow:hidden; transition:width .2s, min-width .2s, border .2s;
}
#anno-panel.open { width:var(--anno-w); min-width:var(--anno-w); border-left:1px solid var(--border); }
#anno-header {
  padding:12px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
#anno-header h3 { font-size:14px; font-weight:600; }
#anno-close { background:none; border:none; cursor:pointer; font-size:16px; color:var(--text-dim); padding:2px 6px; border-radius:4px; }
#anno-close:hover { background:var(--hover); color:var(--text); }
#anno-list { flex:1; overflow-y:auto; padding:8px 0; }
.anno-card {
  padding:10px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s;
}
.anno-card:hover { background:var(--hover); }
.anno-card.active { background:var(--accent-light); }
.anno-card-text { font-size:13px; color:var(--text); line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.anno-card-meta { font-size:11px; color:var(--text-dim); margin-top:6px; display:flex; align-items:center; justify-content:space-between; }
.anno-card-actions { display:flex; gap:4px; }
.anno-card-actions button {
  background:none; border:none; cursor:pointer; font-size:11px; color:var(--text-dim); padding:2px 4px; border-radius:3px;
}
.anno-card-actions button:hover { background:var(--hover); color:var(--accent); }
.anno-card-preview { font-size:11px; color:var(--text-dim); margin-bottom:4px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* paragraph annotation interaction */
.markdown-body [data-p-idx] { position:relative; padding-right:28px; }
.markdown-body [data-p-idx] .p-anno-btn {
  position:absolute; right:2px; top:2px; width:22px; height:22px;
  border:1px solid transparent; border-radius:4px; background:transparent;
  cursor:pointer; display:none; align-items:center; justify-content:center;
  font-size:13px; color:var(--text-dim); line-height:1;
}
.markdown-body [data-p-idx]:hover .p-anno-btn { display:flex; }
.markdown-body [data-p-idx] .p-anno-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
.markdown-body [data-p-idx].has-anno { background:rgba(227,179,65,.08); border-radius:4px; }

/* anno input */
.anno-input-wrap { padding:12px 16px; border-bottom:1px solid var(--border); }
.anno-input-wrap textarea {
  width:100%; min-height:60px; border:1px solid var(--border); border-radius:6px;
  padding:8px; font-size:13px; font-family:inherit; resize:vertical; outline:none;
}
.anno-input-wrap textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(9,105,218,.12); }
.anno-input-actions { display:flex; gap:8px; margin-top:8px; justify-content:flex-end; }
.anno-input-actions button {
  padding:4px 12px; border-radius:4px; font-size:12px; cursor:pointer; border:1px solid var(--border);
  background:white; color:var(--text);
}
.anno-input-actions .anno-save { background:var(--accent); color:white; border-color:var(--accent); }
.anno-input-actions .anno-save:hover { opacity:.9; }
.anno-input-actions .anno-cancel:hover { background:var(--hover); }

/* === MAIN CONTENT === */
#main {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
}
#toolbar {
  padding:8px 24px; border-bottom:1px solid var(--border); background:var(--sidebar-bg);
  display:flex; align-items:center; gap:12px; min-height:48px;
}
#breadcrumb { font-size:14px; color:var(--text-dim); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toolbar-btn {
  padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:white;
  font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px; transition:all .15s;
  color:var(--text);
}
.toolbar-btn:hover { background:var(--hover); border-color:var(--accent); color:var(--accent); }
.toolbar-btn svg { width:14px; height:14px; }

#content-area {
  flex:1; overflow-y:auto; padding:32px 48px;
}
#welcome {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--text-dim); text-align:center;
}
#welcome h2 { font-size:24px; margin-bottom:8px; font-weight:400; }
#welcome p { font-size:14px; }
#md-body {
  display:none; max-width:860px; margin:0 auto; width:100%;
}
#md-body .markdown-body { font-size:15px; line-height:1.7; }
#md-body .markdown-body table { display:table; width:auto; }
#md-body .markdown-body img { max-width:100%; }

/* print / PDF：完整内容、连续不分页 */
@media print {
  html, body { height: auto !important; overflow: visible !important; }
  #app { height: auto !important; overflow: visible !important; flex-direction: column; }
  #main { overflow: visible !important; height: auto !important; display: block !important; }
  #content-area {
    overflow: visible !important; height: auto !important; min-height: 0 !important;
    padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  #welcome { display: none !important; }
  #sidebar, #toolbar, #anno-panel, #sidebar-toggle { display: none !important; }
  #md-body { display: block !important; max-width: 100%; }
  #md-body .markdown-body { font-size: 12px; }
  /* 减少段落/标题内部分页，使导出更连续 */
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6,
  .markdown-body p, .markdown-body li, .markdown-body pre {
    break-inside: avoid; page-break-inside: avoid;
  }
}

/* scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#c1c7cd; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#8b949e; }

/* loading spinner */
.loading { display:flex; align-items:center; justify-content:center; height:200px; }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* empty state */
.empty-state { text-align:center; padding:40px 16px; color:var(--text-dim); font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <button id="sidebar-toggle" title="折叠/展开侧边栏">◀</button>
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
        MD Reader
      </h1>
      <div id="root-bar" onclick="App.showRootInput()" title="点击切换目录">
        <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1Z"/></svg>
        <span id="root-display">loading...</span>
      </div>
      <div id="root-input-wrap">
        <input id="root-input" type="text" placeholder="输入目录绝对路径，回车确认">
      </div>
      <input id="search-box" type="text" placeholder="搜索文件名或全文内容...">
    </div>
    <div id="sidebar-tabs">
      <div class="sidebar-tab active" data-tab="files">文件</div>
      <div class="sidebar-tab" data-tab="favorites">收藏</div>
    </div>
    <div id="file-list"></div>
    <div id="search-results"></div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="toolbar">
      <div id="breadcrumb">选择一个文件开始阅读</div>
      <button class="toolbar-btn" id="btn-fav" title="收藏" style="display:none">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
        <span>收藏</span>
      </button>
      <button class="toolbar-btn" id="btn-anno-toggle" title="批注" style="display:none">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 13.25 12H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 13.543V12H2.75A1.75 1.75 0 0 1 1 10.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.75.75 0 0 1 .53-.22h4.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
        <span>批注</span>
      </button>
      <button class="toolbar-btn" id="btn-pdf" title="导出 PDF" style="display:none">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.75 7.5a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5Zm0 3a.75.75 0 0 0 0 1.5h3.5a.75.75 0 0 0 0-1.5h-3.5Z"/><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>
        导出 PDF
      </button>
    </div>
    <div id="content-area">
      <div id="welcome">
        <h2>Markdown 阅读器</h2>
        <p>从左侧选择文件，或使用搜索框查找内容</p>
      </div>
      <div id="md-body"><div class="markdown-body"></div></div>
    </div>
  </div>

  <!-- ANNOTATION PANEL -->
  <div id="anno-panel">
    <div id="anno-header">
      <h3>批注</h3>
      <button id="anno-close" title="关闭">✕</button>
    </div>
    <div id="anno-input" class="anno-input-wrap" style="display:none">
      <textarea id="anno-textarea" placeholder="输入批注内容..."></textarea>
      <div class="anno-input-actions">
        <button class="anno-cancel" onclick="Annotations.cancelInput()">取消</button>
        <button class="anno-save" onclick="Annotations.saveFromInput()">保存</button>
      </div>
    </div>
    <div id="anno-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
<script>
const App = {
  files: [],
  currentPath: null,
  favorites: JSON.parse(localStorage.getItem('md-reader-favs') || '[]'),
  searchTimer: null,
  activeTab: 'files',

  async init() {
    marked.setOptions({
      highlight: (code, lang) => {
        if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, {language: lang}).value;
        return hljs.highlightAuto(code).value;
      },
      gfm: true, breaks: true,
    });
    this.bindEvents();
    await this.loadRoot();
    await this.loadFiles();
    this.renderFileTree();
    const lastFile = localStorage.getItem('md-reader-last-file');
    if (lastFile && this.files.some(f => f.path === lastFile)) {
      await this.openFile(lastFile);
      const savedScroll = parseInt(localStorage.getItem('md-reader-last-scroll') || '0');
      if (savedScroll) document.getElementById('content-area').scrollTop = savedScroll;
    }
  },

  async loadRoot() {
    try {
      const res = await fetch('/api/root');
      const data = await res.json();
      this.rootPath = data.root || '';
      document.getElementById('root-display').textContent = this.rootPath;
      document.getElementById('root-display').title = this.rootPath;
    } catch (e) { /* ignore */ }
  },

  showRootInput() {
    const wrap = document.getElementById('root-input-wrap');
    const input = document.getElementById('root-input');
    const bar = document.getElementById('root-bar');
    wrap.style.display = 'block';
    bar.style.display = 'none';
    input.value = this.rootPath || '';
    input.focus();
    input.select();
  },

  async changeRoot(newPath) {
    if (!newPath.trim()) { this.hideRootInput(); return; }
    try {
      const res = await fetch('/api/set-root', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ root: newPath.trim() }),
      });
      const data = await res.json();
      if (data.ok) {
        this.rootPath = data.root;
        document.getElementById('root-display').textContent = data.root;
        document.getElementById('root-display').title = data.root;
        await this.loadFiles();
        this.renderFileTree();
        this.currentPath = null;
        document.getElementById('md-body').style.display = 'none';
        document.getElementById('welcome').style.display = '';
        document.getElementById('breadcrumb').textContent = '\u9009\u62e9\u4e00\u4e2a\u6587\u4ef6\u5f00\u59cb\u9605\u8bfb';
      } else {
        alert(data.error || '\u76ee\u5f55\u4e0d\u5b58\u5728');
      }
    } catch (e) { alert('\u5207\u6362\u5931\u8d25: ' + e.message); }
    this.hideRootInput();
  },

  hideRootInput() {
    document.getElementById('root-input-wrap').style.display = 'none';
    document.getElementById('root-bar').style.display = '';
  },

  bindEvents() {
    const searchBox = document.getElementById('search-box');
    searchBox.addEventListener('input', () => {
      clearTimeout(this.searchTimer);
      const q = searchBox.value.trim();
      if (!q) { this.showFileList(); return; }
      if (q.length < 2) return;
      this.searchTimer = setTimeout(() => this.doSearch(q), 300);
    });

    document.querySelectorAll('.sidebar-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        this.activeTab = tab.dataset.tab;
        if (this.activeTab === 'favorites') this.renderFavorites();
        else this.renderFileTree();
        document.getElementById('search-results').style.display = 'none';
        document.getElementById('file-list').style.display = '';
      });
    });

    document.getElementById('btn-fav').addEventListener('click', () => this.toggleFavorite());
    document.getElementById('btn-pdf').addEventListener('click', () => this.exportPDF());
    document.getElementById('btn-anno-toggle').addEventListener('click', () => Annotations.togglePanel());
    document.getElementById('anno-close').addEventListener('click', () => Annotations.closePanel());

    const sidebarToggle = document.getElementById('sidebar-toggle');
    sidebarToggle.addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('collapsed');
      const collapsed = sb.classList.contains('collapsed');
      sidebarToggle.textContent = collapsed ? '▶' : '◀';
      sidebarToggle.classList.toggle('collapsed-pos', collapsed);
      localStorage.setItem('md-reader-sidebar', collapsed ? 'collapsed' : 'open');
    });
    if (localStorage.getItem('md-reader-sidebar') === 'collapsed') {
      sidebarToggle.click();
    }

    const rootInput = document.getElementById('root-input');
    rootInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.changeRoot(rootInput.value);
      else if (e.key === 'Escape') this.hideRootInput();
    });
    rootInput.addEventListener('blur', () => this.hideRootInput());
  },

  async loadFiles() {
    const res = await fetch('/api/files');
    this.files = await res.json();
  },

  renderFileTree() {
    const list = document.getElementById('file-list');
    const files = this.activeTab === 'favorites'
      ? this.files.filter(f => this.favorites.includes(f.path))
      : this.files;
    const groups = {};
    files.forEach(f => {
      const parts = f.path.split('/');
      const dir = parts.length > 1 ? parts.slice(0, -1).join('/') : '(root)';
      if (!groups[dir]) groups[dir] = [];
      groups[dir].push(f);
    });

    if (Object.keys(groups).length === 0) {
      list.innerHTML = '<div class="empty-state">暂无文件</div>';
      return;
    }

    let html = '';
    for (const [dir, dirFiles] of Object.entries(groups)) {
      html += `<div class="dir-group">`;
      html += `<div class="dir-name" onclick="this.classList.toggle('collapsed')"><span class="arrow">▼</span> ${this.escHtml(dir)} (${dirFiles.length})</div>`;
      html += `<div class="dir-files">`;
      for (const f of dirFiles) {
        const isFav = this.favorites.includes(f.path);
        const isActive = this.currentPath === f.path;
        html += `<div class="file-item${isActive ? ' active' : ''}" data-path="${this.escAttr(f.path)}" onclick="App.openFile('${this.escAttr(f.path)}')">`;
        html += `<span>${this.escHtml(f.name)}</span>`;
        html += `<span class="fav-star${isFav ? ' is-fav' : ''}" onclick="event.stopPropagation();App.toggleFavFromList('${this.escAttr(f.path)}')">★</span>`;
        html += `</div>`;
      }
      html += `</div></div>`;
    }
    list.innerHTML = html;
  },

  renderFavorites() {
    this.renderFileTree();
  },

  async openFile(path) {
    this.currentPath = path;
    this.updateActiveStates();
    document.getElementById('breadcrumb').textContent = path;
    document.getElementById('btn-fav').style.display = '';
    document.getElementById('btn-pdf').style.display = '';
    document.getElementById('btn-anno-toggle').style.display = '';
    this.updateFavButton();

    const mdBody = document.getElementById('md-body');
    const welcome = document.getElementById('welcome');
    welcome.style.display = 'none';
    mdBody.style.display = 'block';
    mdBody.querySelector('.markdown-body').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
      const res = await fetch(`/api/file?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      if (data.error) {
        mdBody.querySelector('.markdown-body').innerHTML = `<div class="empty-state">${data.error}</div>`;
        return;
      }
      const html = marked.parse(data.content);
      mdBody.querySelector('.markdown-body').innerHTML = html;
      Annotations.processParagraphs();
      Annotations.load(path);
      const contentArea = document.getElementById('content-area');
      contentArea.scrollTop = 0;
      document.title = `${path.split('/').pop()} — MD Reader`;
      localStorage.setItem('md-reader-last-file', path);
      this._scrollListener && contentArea.removeEventListener('scroll', this._scrollListener);
      this._scrollListener = () => localStorage.setItem('md-reader-last-scroll', contentArea.scrollTop);
      contentArea.addEventListener('scroll', this._scrollListener, { passive: true });
    } catch (e) {
      mdBody.querySelector('.markdown-body').innerHTML = `<div class="empty-state">加载失败: ${e.message}</div>`;
    }
  },

  updateActiveStates() {
    document.querySelectorAll('.file-item').forEach(el => {
      el.classList.toggle('active', el.dataset.path === this.currentPath);
    });
  },

  async doSearch(query) {
    const fileList = document.getElementById('file-list');
    const searchResults = document.getElementById('search-results');
    fileList.style.display = 'none';
    searchResults.style.display = 'block';
    searchResults.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    let results;
    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
      results = await res.json();
    } catch (e) {
      searchResults.innerHTML = `<div class="empty-state">搜索失败: ${e.message}</div>`;
      return;
    }

    if (results.length === 0) {
      searchResults.innerHTML = '<div class="empty-state">未找到匹配内容</div>';
      return;
    }

    const pattern = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    let html = '';
    for (const r of results) {
      html += `<div class="search-result-file" onclick="App.openFile('${this.escAttr(r.path)}')">`;
      html += `<div class="search-result-path">${this.escHtml(r.path)}</div>`;
      for (const m of r.matches.slice(0, 3)) {
        const highlighted = this.escHtml(m.snippet).replace(pattern, '<mark>$1</mark>');
        html += `<div class="search-result-snippet">${highlighted}</div>`;
      }
      if (r.matches.length > 3) {
        html += `<div class="search-result-snippet" style="font-style:italic">... 还有 ${r.matches.length - 3} 处匹配</div>`;
      }
      html += `</div>`;
    }
    searchResults.innerHTML = html;
  },

  showFileList() {
    document.getElementById('file-list').style.display = '';
    document.getElementById('search-results').style.display = 'none';
  },

  toggleFavorite() {
    if (!this.currentPath) return;
    this.toggleFavFromList(this.currentPath);
    this.updateFavButton();
  },

  toggleFavFromList(path) {
    const idx = this.favorites.indexOf(path);
    if (idx >= 0) this.favorites.splice(idx, 1);
    else this.favorites.push(path);
    localStorage.setItem('md-reader-favs', JSON.stringify(this.favorites));
    if (this.activeTab === 'favorites') this.renderFavorites();
    else this.renderFileTree();
    this.updateFavButton();
  },

  updateFavButton() {
    const btn = document.getElementById('btn-fav');
    if (!this.currentPath) return;
    const isFav = this.favorites.includes(this.currentPath);
    btn.querySelector('span').textContent = isFav ? '已收藏' : '收藏';
    btn.querySelector('svg').style.fill = isFav ? 'var(--fav-color)' : 'currentColor';
  },

  exportPDF() {
    if (!this.currentPath) return;
    window.print();
  },

  escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; },
  escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); },
};

const Annotations = {
  data: [],
  editingId: null,
  targetIdx: null,

  togglePanel() {
    document.getElementById('anno-panel').classList.toggle('open');
  },
  closePanel() {
    document.getElementById('anno-panel').classList.remove('open');
  },

  processParagraphs() {
    const body = document.querySelector('#md-body .markdown-body');
    if (!body) return;
    let idx = 0;
    const blocks = body.querySelectorAll(':scope > p, :scope > h1, :scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6, :scope > blockquote, :scope > ul, :scope > ol, :scope > table, :scope > pre');
    blocks.forEach(el => {
      el.setAttribute('data-p-idx', idx);
      const btn = document.createElement('span');
      btn.className = 'p-anno-btn';
      btn.textContent = '+';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        Annotations.startNew(parseInt(el.getAttribute('data-p-idx')), el);
      });
      el.prepend(btn);
      idx++;
    });
  },

  async load(path) {
    try {
      const res = await fetch(`/api/annotations?path=${encodeURIComponent(path)}`);
      this.data = await res.json();
    } catch (e) { this.data = []; }
    this.renderCards();
    this.applyHighlights();
  },

  renderCards() {
    const list = document.getElementById('anno-list');
    if (!this.data.length) {
      list.innerHTML = '<div class="empty-state">暂无批注<br>悬浮段落，点击右侧 + 添加</div>';
      return;
    }
    const sorted = [...this.data].sort((a, b) => (a.paragraph_index || 0) - (b.paragraph_index || 0));
    let html = '';
    for (const a of sorted) {
      const time = a.updated ? a.updated.slice(5, 16).replace('T', ' ') : '';
      const preview = App.escHtml(a.text_fragment || '').slice(0, 40);
      html += `<div class="anno-card" data-anno-id="${a.id}" onclick="Annotations.scrollTo(${a.paragraph_index})">`;
      if (preview) html += `<div class="anno-card-preview">${preview}...</div>`;
      html += `<div class="anno-card-text">${App.escHtml(a.content)}</div>`;
      html += `<div class="anno-card-meta"><span>${time}</span><div class="anno-card-actions">`;
      html += `<button onclick="event.stopPropagation();Annotations.startEdit('${a.id}')">编辑</button>`;
      html += `<button onclick="event.stopPropagation();Annotations.remove('${a.id}')">删除</button>`;
      html += `</div></div></div>`;
    }
    list.innerHTML = html;
  },

  applyHighlights() {
    document.querySelectorAll('.markdown-body [data-p-idx]').forEach(el => el.classList.remove('has-anno'));
    for (const a of this.data) {
      const el = document.querySelector(`.markdown-body [data-p-idx="${a.paragraph_index}"]`);
      if (el) el.classList.add('has-anno');
    }
  },

  scrollTo(idx) {
    const el = document.querySelector(`.markdown-body [data-p-idx="${idx}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.transition = 'background .3s';
      el.style.background = '#fff8c5';
      setTimeout(() => { el.style.background = ''; }, 1500);
    }
  },

  startNew(idx, el) {
    this.editingId = null;
    this.targetIdx = idx;
    const frag = (el.textContent || '').slice(0, 60).trim();
    document.getElementById('anno-textarea').value = '';
    document.getElementById('anno-textarea').dataset.fragment = frag;
    document.getElementById('anno-input').style.display = '';
    document.getElementById('anno-panel').classList.add('open');
    document.getElementById('anno-textarea').focus();
  },

  startEdit(id) {
    const a = this.data.find(x => x.id === id);
    if (!a) return;
    this.editingId = id;
    this.targetIdx = a.paragraph_index;
    document.getElementById('anno-textarea').value = a.content;
    document.getElementById('anno-textarea').dataset.fragment = a.text_fragment || '';
    document.getElementById('anno-input').style.display = '';
    document.getElementById('anno-textarea').focus();
  },

  cancelInput() {
    document.getElementById('anno-input').style.display = 'none';
    document.getElementById('anno-textarea').value = '';
    this.editingId = null;
    this.targetIdx = null;
  },

  async saveFromInput() {
    const text = document.getElementById('anno-textarea').value.trim();
    if (!text || !App.currentPath) return;
    const frag = document.getElementById('anno-textarea').dataset.fragment || '';
    const annotation = {
      id: this.editingId || ('a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
      paragraph_index: this.targetIdx,
      text_fragment: frag,
      content: text,
    };
    try {
      const res = await fetch('/api/annotations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: App.currentPath, annotation }),
      });
      const result = await res.json();
      if (result.ok) this.data = result.annotations;
    } catch (e) { /* silently fail */ }
    this.cancelInput();
    this.renderCards();
    this.applyHighlights();
  },

  async remove(id) {
    if (!App.currentPath) return;
    if (!confirm('确定删除这条批注？')) return;
    try {
      const res = await fetch('/api/annotations/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: App.currentPath, id }),
      });
      const result = await res.json();
      if (result.ok) this.data = result.annotations;
    } catch (e) { /* silently fail */ }
    this.renderCards();
    this.applyHighlights();
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
